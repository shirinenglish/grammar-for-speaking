<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Speaking Marathon | Coach Shirin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#FAF3F4; --surface:#FFFFFF; --ink:#2A1219; --muted:#6E5560; --line:#EADCE0;
  --mark:#F1D27A; --mark-ink:#2A1219;
  --ok:#1F7A55; --ok-bg:#E3F5EC; --bad:#B3263E; --bad-bg:#FBE6EB;
  --b1:#C0546F; --b2:#8E2440; --c1:#5A1530;
  --accent:#7A1F35; --wine:#7A1F35; --on-wine:#FBEFF2;
  --head:"Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --paper:#170E12; --surface:#22151A; --ink:#F4E8EC; --muted:#C2A8B1; --line:#3A2630;
    --mark:#E3BF5E; --mark-ink:#1A0E12;
    --ok:#5FD39A; --ok-bg:#163326; --bad:#F07A95; --bad-bg:#3A1C26;
    --b1:#F0A9B9; --b2:#D9657F; --c1:#B8435F;
    --accent:#D9657F; --wine:#4A1424; --on-wine:#FBEFF2;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:800px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.verb{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.btn{background:var(--accent);color:var(--paper);border:0;border-radius:10px;padding:11px 20px;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.box p:first-child{margin-top:0} .box p:last-child{margin-bottom:0}
.note{color:var(--muted);font-size:.95rem}

/* ---------- Home ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:20px 0 0}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);flex:0 0 auto}
.topbar small{display:block;color:var(--muted);font-size:.85rem;line-height:1.2}
.topbar strong{font-family:var(--head);font-size:1.05rem}
.hero{padding:28px 0 0}
.hero h1{font-size:clamp(2.5rem,9vw,4.6rem);font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.hero .lead{color:var(--muted);max-width:34em;margin:14px 0 0;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--head);font-size:1.7rem;color:var(--accent);line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.cta{margin-top:20px}

.track{margin:28px 0 0;padding:22px 20px 16px;background:var(--wine);color:var(--on-wine);border-radius:18px}
.track-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.track-head h2{font-size:1.4rem}
.lane{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.2);margin:46px 14px 10px}
.lane .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--mark);transition:width .9s ease}
.cp{position:absolute;top:50%;width:3px;height:24px;transform:translate(-50%,-50%);background:var(--on-wine);opacity:.75;border-radius:2px}
.runner{position:absolute;top:-38px;font-size:1.7rem;transform:translateX(-50%) scaleX(-1);transition:left .9s ease;line-height:1}
.flag{position:absolute;right:-14px;top:-36px;font-size:1.5rem;line-height:1}
.lane-labels{display:grid;grid-template-columns:5fr 6fr 4fr;margin:0 14px;font-size:.85rem;opacity:.9}
.lane-labels span{padding-left:4px}

.level{margin:44px 0 0}
.level h2{font-size:1.5rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.level h2 span{font-family:var(--body);font-size:.95rem;color:var(--muted);font-weight:400}
.path{list-style:none;margin:14px 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:var(--line)}
.day-btn{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:0;padding:10px 0}
.num{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:700;background:var(--surface);border:2px solid var(--lv);color:var(--lv);z-index:1}
.done .num{background:var(--lv);color:var(--surface)}
.day-text{flex:1;min-width:0}
.day-text strong{display:block;font-family:var(--head);font-size:1.12rem;font-weight:700}
.day-text span{color:var(--muted);font-size:.95rem}
.tag{flex:0 0 auto;font-size:.85rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.free{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:700}
.day-btn:hover .day-text strong{text-decoration:underline}
.b1{--lv:var(--b1)} .b2{--lv:var(--b2)} .c1{--lv:var(--c1)}

.about{margin:64px 0 0;max-width:720px}
.about h2{font-size:2rem;color:var(--accent)}
.about p{margin:14px 0 0}
.creds{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.creds li{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:12px 14px}
.creds strong{display:block;font-family:var(--head)}
.creds span{color:var(--muted);font-size:.95rem}
.inspire{margin:56px 0 0;background:var(--wine);color:var(--on-wine);border-radius:20px;padding:40px 28px}
.inspire blockquote{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.25;max-width:22em}
.inspire p{margin:16px 0 0;opacity:.9;max-width:34em}

.finishline{margin:56px 0 0}
.finishline h2{font-size:2rem;color:var(--accent)}
.cert{position:relative;margin-top:16px;background:var(--surface);border:6px double var(--accent);border-radius:8px;padding:34px 24px;text-align:center}
.cert .t1{font-family:var(--head);font-size:.95rem;color:var(--muted)}
.cert .t2{font-family:var(--head);font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;color:var(--accent);margin:6px 0 18px}
.cert .who{font-family:var(--head);font-size:clamp(1.5rem,5vw,2rem);font-weight:700;border-bottom:2px solid var(--line);display:inline-block;min-width:60%;padding-bottom:4px}
.cert p{margin:14px 0 0}
.cert.locked > *:not(.lock){opacity:.25}
.lock{position:absolute;inset:0;display:grid;place-items:center;padding:20px;font-weight:700;font-family:var(--head);font-size:1.15rem}
.lock span{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:12px 18px}
.namefield{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.namefield input{flex:1;min-width:180px;font:inherit;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
footer{margin:56px 0 40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}

/* ---------- Day page ---------- */
.back{margin:20px 0 0;background:none;border:0;color:var(--muted);padding:6px 0;text-decoration:underline}
.day-head{padding:14px 0 6px}
.day-head .meta{color:var(--lv);font-weight:700}
.day-head h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:800;margin-top:4px}
.day-head p{color:var(--muted);margin:6px 0 0}
.stations{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;margin:8px -2px 0;scrollbar-width:thin}
.st{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:5px 12px 5px 5px;font-size:.9rem;white-space:nowrap}
.st b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-family:var(--head)}
.st.done b{background:var(--ok);color:var(--surface)}
.st.cur{border-color:var(--accent)}
.st.cur b{background:var(--accent);color:var(--paper)}
.station{margin-top:10px}
.station .kicker{color:var(--accent);font-weight:700;font-size:.95rem}
.station h2{font-size:1.6rem;margin:2px 0 6px}
.station .sub{color:var(--muted);margin:0 0 16px}
.station .box + .box{margin-top:14px}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin:24px 0 0}
.q{font-weight:700;margin:0 0 8px}
.qblock{padding:14px 0;border-top:1px solid var(--line)}
.qblock:first-child{border-top:0;padding-top:0}
.qblock:last-child{padding-bottom:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left}
.choice.sel{border-color:var(--accent);background:var(--accent);color:var(--paper)}
.choice.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
.fb{margin-top:6px;font-size:.95rem;min-height:0}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.reveal{margin-top:14px;padding:16px;border-radius:12px;background:var(--paper);border:1px dashed var(--accent)}
.bigline{font-family:var(--head);font-size:clamp(1.25rem,4.5vw,1.55rem);font-weight:500;line-height:1.4;border-left:5px solid var(--accent);padding:4px 0 4px 14px;margin:0 0 14px}
.answer{font-size:1.1rem;line-height:1.8}
.listen{margin-bottom:12px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;margin:12px 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--surface);font-family:var(--head)}
.scale{display:grid;gap:6px;margin:12px 0}
.scale div{display:flex;align-items:center;gap:10px}
.scale i{display:block;height:12px;border-radius:6px;background:var(--accent)}
.scale span{flex:0 0 8em}
.tip{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--surface);border:2px solid var(--mark)}
.word{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word .w{font-family:var(--head);font-size:1.25rem;font-weight:700;min-width:5.5em}
.sound{background:none;border:2px solid var(--line);border-radius:50%;width:38px;height:38px}
details{margin-top:12px} summary{cursor:pointer;font-weight:700;color:var(--accent)}
.clock-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.timer{font-family:var(--head);font-size:1.6rem;color:var(--accent)}
.clock-q{font-family:var(--head);font-size:1.3rem;margin:6px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:6px 12px}
.built{border:2px dashed var(--line);border-radius:10px;padding:8px;margin:8px 0}
.built .chip{background:var(--surface);border-color:var(--accent)}
.tapline{display:flex;flex-wrap:wrap;gap:6px}
.tapword{background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:5px 10px}
.tapword.right{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through}
.tapword.nope{border-color:var(--muted);opacity:.6}
.rec{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.rec .btn.recording{background:var(--bad)}
.rec audio{max-width:100%}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.starters li{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.95rem}
.check label{display:flex;gap:10px;padding:6px 0;cursor:pointer}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.formula span{background:var(--wine);color:var(--on-wine);border-radius:8px;padding:6px 12px;font-weight:700}

.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.uses div{background:var(--paper);border-radius:10px;padding:12px;border-left:4px solid var(--accent)}
.uses strong{display:block;font-family:var(--head)}
.uses span{font-style:italic}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.mcard p{margin:0}
.mcard .bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mcard .good{color:var(--ok);font-weight:700;margin-top:4px}
.mcard .why{color:var(--muted);font-size:.92rem;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px}
.bubble.me{align-self:flex-end;border-radius:16px 16px 4px 16px;border-color:var(--accent)}
.bubble small{color:var(--muted);font-weight:700}
.bubble p{margin:2px 0 8px}
.blank{font-weight:700;color:var(--accent)}
.gapline input,.form input,textarea{font:inherit;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.gapline input{width:9.5em}
.gapline input.ok{border-color:var(--ok)} .gapline input.no{border-color:var(--bad)}
.score{margin-left:10px;font-weight:700}
textarea{width:100%;margin:12px 0 6px}
.planner{min-width:480px} .planner td,.planner th{text-align:center} .planner td:first-child{text-align:left}
.form{display:grid;gap:10px;margin:10px 0 14px}
.form label{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.form input{flex:1;min-width:160px}
.profile{display:flex;gap:14px;margin-top:14px;padding:16px;border-radius:14px;background:var(--wine);color:var(--on-wine)}
.profile .pic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:1.3rem}
.profile strong{font-family:var(--head);font-size:1.15rem}
.profile small{display:block;opacity:.85}
.profile p{margin:8px 0 0}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,6,12,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modal .box{max-width:420px;width:100%}
.modal h2{font-size:1.5rem;margin-bottom:8px}
.modal input{font:inherit;width:100%;padding:10px;margin:12px 0 6px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.modal .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.err{color:var(--bad);font-size:.95rem;min-height:1.4em}
.medal{font-size:3rem;line-height:1}
@media (max-width:540px){ body{font-size:16px} .tag{font-size:.8rem;padding:2px 8px} .stat b{font-size:1.4rem} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

/* ===================== SAVED PROGRESS ===================== */
function load(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let unlocked = load("gsm-unlocked", false);
let progress = load("gsm-progress", {});      // { "1": [0,1,2] }
let activeDates = load("gsm-dates", []);
let certName = load("gsm-name", "");

function dateKey(d){ return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function stationsDone(n){ return (progress[n] || []).length; }
function dayFinished(n){ return stationsDone(n) >= STATIONS.length; }
function finishedCount(){ return DAYS.filter(d => dayFinished(d.n)).length; }
function kmRun(){ let s = 0; DAYS.forEach(d => s += stationsDone(d.n)); return s * TOTAL_KM / (DAYS.length * STATIONS.length); }
function streak(){
  const set = new Set(activeDates); const d = new Date(); let c = 0;
  if (!set.has(dateKey(d))) d.setDate(d.getDate() - 1);
  while (set.has(dateKey(d))){ c++; d.setDate(d.getDate() - 1); }
  return c;
}
function markStation(n, i){
  progress[n] = progress[n] || [];
  if (!progress[n].includes(i)) progress[n].push(i);
  const t = dateKey(new Date()); if (!activeDates.includes(t)) activeDates.push(t);
  save("gsm-progress", progress); save("gsm-dates", activeDates);
}

const app = document.getElementById("app");
const $ = s => document.querySelector(s);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ===================== HOME ===================== */

    </div>
    <div class="cta"><button class="btn" id="go">${km > 0 ? "Continue running" : "Start Day 1 free"}</button></div>
  </header>
  <section class="track" aria-label="Your race">
    <div class="track-head"><h2>Your race</h2><span>${km.toFixed(1)} of ${TOTAL_KM} km</span></div>
    <div class="lane">
      <div class="fill" style="width:${pct}%"></div>
      <span class="cp" style="left:33.33%"></span><span class="cp" style="left:73.33%"></span>
      <span class="runner" style="left:${Math.max(pct,1)}%" aria-hidden="true">🏃‍♀️</span><span class="flag" aria-hidden="true">🏁</span>

      else if (!d.free && !unlocked) tag = `<span class="tag">🔒</span>`;
      else if (sd && !done) tag = `<span class="tag">${sd} of 8</span>`;
      html += `<li class="${done ? "done" : ""}"><button class="day-btn" data-day="${d.n}">
        <span class="num" aria-hidden="true">${done ? "✓" : d.n}</span>
        <span class="day-text"><strong>Day ${d.n}: ${d.grammar}</strong><span>${d.use}, ${d.part}</span></span>${tag}</button></li>`;
    });
    html += `</ol></section>`;
  });
  html += `
  <section class="about">
    <h2>Hi, I’m Shirin</h2>
    <p>I’m an English teacher, and I prepare students for the CEFR Multilevel exam and IELTS. I teach live online lessons, so you can join from anywhere.</p>
    <p>I made this marathon because many students know the grammar rules but don’t use them when they speak. Here, every rule goes straight into a speaking answer, so grammar becomes something you can actually hear.</p>
    <ul class="creds">
      <li><strong>Bachelor’s degree</strong><span>UzSWLU</span></li>
      <li><strong>Master’s degree</strong><span>WIUT</span></li>
      <li><strong>Studied in Europe</strong><span>International experience</span></li>
      <li><strong>Exam preparation</strong><span>CEFR Multilevel and IELTS</span></li>
    </ul>
  </section>
  <section class="inspire">
    <blockquote>You don’t need perfect grammar to start speaking. You need to start speaking to make your grammar better.</blockquote>
    <p>One structure a day. Fifteen days. 42.2 kilometres. By the finish line, you’ll hear the difference in your own voice.</p>
  </section>
  <section class="finishline">
    <h2>The finish line</h2>
    <p class="note">Finish all 15 days to get your certificate. Take a screenshot and share it.</p>
    ${certificate(fin === DAYS.length)}
  </section>` + footer();

function certificate(open){
  const today = new Date().toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"});

    <div class="t1">Certificate of completion</div>

}
function footer(){
  return `<footer>Questions, or want to join the full marathon? Write on Telegram: <a href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener">@${CONFIG.telegram}</a></footer>`;
}

/* ===================== MODALS ===================== */
const modal = $("#modal"), modalBox = $("#modalBox");
function openModal(html){ modalBox.innerHTML = html; modal.classList.add("open"); }
function closeModal(){ modal.classList.remove("open"); }
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

let pendingDay = null;
function openDay(n){
  const d = DAYS.find(x => x.n === n);
  if (d.free || unlocked){ location.hash = "day-" + n; return; }
  pendingDay = n;
  openModal(`<h2>This day is for marathon runners</h2>
    <p>Day 1 is free. Enter your access code to open days 2 to 15.</p>
    <label for="code">Access code</label><input id="code" type="text" autocomplete="off" autocapitalize="characters">
    <div class="err" id="err"></div>
    <div class="row"><button class="btn" id="unlockBtn">Open the marathon</button><button class="btn ghost" id="cancelBtn">Cancel</button></div>
    <p class="note">No code yet? Write to <a href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener">@${CONFIG.telegram}</a> on Telegram.</p>`);
  const inp = $("#code"); inp.focus();
  const tryIt = () => {
    if (inp.value.trim().toLowerCase() === CONFIG.accessCode.toLowerCase()){
      unlocked = true; save("gsm-unlocked", true); closeModal(); location.hash = "day-" + pendingDay;
    } else $("#err").textContent = "This code doesn’t match. Check it and try again.";
  };
  $("#unlockBtn").onclick = tryIt; $("#cancelBtn").onclick = closeModal;
  inp.onkeydown = e => { if (e.key === "Enter") tryIt(); if (e.key === "Escape") closeModal(); };
}

/* ===================== DAY PAGE ===================== */
let curDay = 1, curSt = 0;
function renderDay(n){
  const d = DAYS.find(x => x.n === n);
  if (!d || (!d.free && !unlocked)){ location.hash = ""; return; }
  curDay = n;
  const c = CONTENT[n];
  let html = `<button class="back" id="back">All days</button>
    <header class="day-head ${d.lv}"><div class="meta">Day ${d.n}, ${d.lv.toUpperCase()}, ${d.part}</div><h1>${d.grammar}</h1><p>${d.use}</p></header>`;
  if (!c){
    app.innerHTML = html + `<div class="box" style="margin-top:20px"><p>This day is being prepared. Please check again soon.</p></div>` + footer();
    $("#back").onclick = () => location.hash = ""; window.scrollTo(0,0); return;
  }
  const firstOpen = STATIONS.findIndex((_, i) => !(progress[n] || []).includes(i));
  curSt = firstOpen === -1 ? 0 : firstOpen;
  app.innerHTML = html + `<nav class="stations" id="stations" aria-label="Lesson stations"></nav><div id="stationArea"></div>` + footer();
  $("#back").onclick = () => location.hash = "";
  window.scrollTo(0,0);
  renderStation();
}

function renderNav(){
  const done = progress[curDay] || [];
  $("#stations").innerHTML = STATIONS.map((s, i) =>
    `<button class="st ${i === curSt ? "cur" : ""} ${done.includes(i) ? "done" : ""}" data-st="${i}"><b>${done.includes(i) && i !== curSt ? "✓" : i + 1}</b><span>${s}</span></button>`).join("");
  document.querySelectorAll(".st").forEach(b => b.onclick = () => { curSt = +b.dataset.st; renderStation(); });
  const cur = document.querySelector(".st.cur"); if (cur) cur.scrollIntoView({block:"nearest", inline:"center"});
}

let ANS = {};
function renderStation(){
  stopRecording(); clearInterval(clockTimer);
  ANS = {};
  renderNav();
  const s = CONTENT[curDay][curSt];
  const last = curSt === STATIONS.length - 1;
  let body = "";
  const R = RENDER[s.type];
  body = R.html(s);
  $("#stationArea").innerHTML = `<section class="station">
      <div class="kicker">Station ${curSt + 1} of ${STATIONS.length}: ${STATIONS[curSt]}</div>
      <h2>${s.title}</h2><p class="sub">${s.sub}</p>${body}
      <div class="nav-row">
        <button class="btn ghost" id="prevSt" ${curSt === 0 ? "disabled" : ""}>Back</button>
        <button class="btn" id="nextSt">${last ? "Finish Day " + curDay + " 🏁" : "Next station"}</button>
      </div></section>`;
  wireChoices();
  if (R.setup) R.setup(s);
  $("#prevSt").onclick = () => { if (curSt > 0){ curSt--; renderStation(); scrollToStations(); } };
  $("#nextSt").onclick = () => {
    markStation(curDay, curSt);
    if (last) celebrate(); else { curSt++; renderStation(); scrollToStations(); }
  };
}
function scrollToStations(){ const el = $("#stations"); if (el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 10}); }

function celebrate(){
  const allDone = dayFinished(curDay);
  openModal(`<div class="medal">🏅</div><h2>Day ${curDay} finished!</h2>
    <p>${allDone ? `You’ve run ${kmRun().toFixed(1)} of ${TOTAL_KM} km. Streak: ${streak()} day${streak() === 1 ? "" : "s"}.` : `Go back to any station without a ✓ to finish the whole day.`}</p>
    <div class="row"><button class="btn" id="toRace">Back to the race</button></div>`);
  $("#toRace").onclick = () => { closeModal(); location.hash = ""; };
}

/* ---------- Choice buttons (shared) ---------- */
let keyN = 0;
function choiceHTML(o, a, why, fill){
  const k = "c" + (keyN++); ANS[k] = {a, why, o, fill};
  return `<div class="choices" data-key="${k}">${o.map((x, i) => `<button class="choice" data-i="${i}">${x}</button>`).join("")}</div><div class="fb" id="fb-${k}"></div>`;
}
function wireChoices(){
  document.querySelectorAll(".choices[data-key]").forEach(g => {
    const info = ANS[g.dataset.key]; if (!info) return;
    g.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      if (g.dataset.solved) return;
      const ok = +b.dataset.i === info.a, fb = $("#fb-" + g.dataset.key);
      b.classList.add(ok ? "right" : "wrong");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? "✓ " + (info.why || "Correct!") : "Not quite. Try again.";
      if (ok && info.fill){ const f = document.getElementById(info.fill); if (f) f.textContent = info.o[info.a]; }
      if (ok){ g.dataset.solved = "1"; g.dispatchEvent(new Event("solved", {bubbles:true})); }
    });
  });
}

/* ---------- Station renderers ---------- */
function cleanText(s){ return s.toLowerCase().replace(/’/g,"'").replace(/[?.!]/g,"").replace(/\s+/g," ").trim(); }
const RENDER = {
  poll: {

      <div class="box" style="margin-top:14px"><p class="q">Quick test: right or wrong?</p>${s.test.map(t =>

        <button class="btn" id="gapCheck" style="margin-top:12px">Check answers</button> <span class="score" id="gapScore"></span></div>`,
    setup: s => {

/* ---------- Beat the clock ---------- */
let clockTimer = null;
function setupClock(items){
  const box = $("#clock"); let best = load("gsm-best-" + curDay, 0);
  const intro = () => {
    box.innerHTML = `<div class="clock-top"><span>⏱ 60 seconds</span><span>Best: ${best} of ${items.length}</span></div>
      <p>Choose the correct answer as fast as you can.</p><button class="btn" id="clockStart">Start</button>`;
    $("#clockStart").onclick = start;
  };
  const start = () => {
    const qs = shuffle(items); let i = 0, score = 0, left = 60;
    const show = () => {
      const q = qs[i];
      box.innerHTML = `<div class="clock-top"><span>${i + 1} of ${qs.length}</span><span class="timer" id="tLeft">${left}</span></div>
        <p class="clock-q">${q.q}</p><div class="choices">${q.o.map((o, oi) => `<button class="choice" data-i="${oi}">${o}</button>`).join("")}</div>`;
      box.querySelectorAll(".choice").forEach(b => b.onclick = () => {
        const ok = +b.dataset.i === q.a; if (ok) score++;
        b.classList.add(ok ? "right" : "wrong");
        box.querySelectorAll(".choice").forEach(x => x.disabled = true);
        setTimeout(() => { i++; if (i >= qs.length) end(); else show(); }, 450);
      });
    };
    const end = () => {
      clearInterval(clockTimer);
      const isBest = score > best; if (isBest){ best = score; save("gsm-best-" + curDay, best); }
      box.innerHTML = `<div class="clock-top"><span>Finished!</span><span class="timer">${score} of ${qs.length}</span></div>
        <p>${isBest ? "🎉 New personal best!" : score === qs.length ? "Perfect score!" : "Good run. Can you beat " + best + "?"}</p><button class="btn" id="clockStart">Try again</button>`;
      $("#clockStart").onclick = start;
    };
    clearInterval(clockTimer);
    clockTimer = setInterval(() => { left--; const t = $("#tLeft"); if (t) t.textContent = left; if (left <= 0) end(); }, 1000);
    show();
  };
  intro();
}

/* ---------- Build the sentence ---------- */
function setupJumble(sentences){
  const host = $("#jumbles");
  host.innerHTML = sentences.map((s, i) => `<div class="qblock" data-j="${i}"><div class="built chips" id="b${i}"></div><div class="chips" id="p${i}"></div>
     <div style="margin-top:8px"><button class="btn ghost" data-jc="${i}">Check</button></div><div class="fb" id="jf${i}"></div></div>`).join("");
  sentences.forEach((s, i) => {
    const words = s.split(" "); let order = shuffle(words);
    if (order.join(" ") === s) order = order.slice().reverse();
    const pool = $("#p" + i), built = $("#b" + i);
    order.forEach(w => { const c = document.createElement("button"); c.className = "chip"; c.textContent = w;
      c.onclick = () => { (c.parentElement === pool ? built : pool).appendChild(c); }; pool.appendChild(c); });
    document.querySelector(`[data-jc="${i}"]`).onclick = () => {
      const got = [...built.children].map(c => c.textContent).join(" "), fb = $("#jf" + i);
      if (got === s){ fb.className = "fb ok"; fb.textContent = "✓ " + s + "."; }
      else { fb.className = "fb no"; fb.textContent = pool.children.length ? "Use all the words first." : "Not quite. Tap words to move them and try again."; }
    };
  });
}

/* ---------- Voice recording ---------- */
let rec = null, recTimer = null;
async function toggleRecord(qi, btn, sec){
  const msg = $("#m" + qi);
  if (rec && rec.state === "recording"){ stopRecording(); return; }
  if (!window.MediaRecorder || !navigator.mediaDevices){ msg.textContent = "Recording doesn’t work in this browser. Practise out loud, or use your phone’s voice recorder."; return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ msg.textContent = "Allow microphone access in your browser to record your answer."; return; }
  const chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const a = $("#a" + qi); if (a){ a.src = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType})); a.hidden = false; }
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("recording"); btn.textContent = "● Record again";
    msg.textContent = "Listen to yourself. Did you use the winning formula?";
  };
  rec.start(); msg.textContent = "";
  let left = sec || 30; btn.classList.add("recording"); btn.textContent = `■ Stop (${left} s)`;
  recTimer = setInterval(() => { left--; btn.textContent = `■ Stop (${left} s)`; if (left <= 0) stopRecording(); }, 1000);
}
function stopRecording(){ clearInterval(recTimer); if (rec && rec.state === "recording") rec.stop(); }

/* ===================== ROUTING ===================== */
function route(){
  closeModal(); stopRecording();
  const m = location.hash.match(/^#day-(\d+)$/);
  if (m) renderDay(+m[1]); else { renderHome(); window.scrollTo(0,0); }
}
window.addEventListener("hashchange", route);
route();
